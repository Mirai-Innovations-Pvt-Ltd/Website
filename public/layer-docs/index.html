l{padding-left:24px}li{margin:7px 0}.lead{font-size:17px;line-height:1.72;color:#d7dbde}.callout{border:1px solid #365064;background:linear-gradient(90deg,rgba(53,86,107,.16),rgba(16,28,39,.55));padding:13px 15px;margin:18px 0;font-size:14px;line-height:1.55;color:#c9d3d9}.callout strong{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#9fc5dd;margin-right:7px}.warn{border-color:#5b513a;background:linear-gradient(90deg,rgba(116,96,52,.16),rgba(16,28,39,.55))}.warn strong{color:#d1bb83}.code{margin:15px 0;border:1px solid #293944;background:#0a121a;padding:14px 16px;overflow:auto;color:#cbd5db;font:12px/1.62 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}.card{border:1px solid #2b3a46;background:#0d1720;padding:14px 15px}.card b{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:#d3d9dd}.card p{font-size:13px;line-height:1.5;color:#8f9ca6;margin:7px 0 0}.table-wrap{overflow:auto;margin:15px 0}table{width:100%;border-collapse:collapse;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}th,td{padding:10px 11px;border:1px solid #2a3945;text-align:left;vertical-align:top}th{background:#111e29;color:#cad4da;text-transform:uppercase;letter-spacing:.08em}td{color:#aeb8bf;background:rgba(11,20,29,.62)}.toc-inner{padding:13px 14px 18px}.toc a{display:block;text-decoration:none;color:#afb8bf;font:600 11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px}.toc a:hover{color:#eef1f2}.footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#70808c}.modal{position:fixed;inset:0;background:rgba(3,8,12,.74);display:none;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:20}.modal.open{display:flex}.searchbox{width:min(660px,calc(100vw - 40px));border:1px solid #3a4b58;background:#0d1720;box-shadow:0 24px 80px rgba(0,0,0,.55)}.searchbox input{width:100%;height:54px;border:0;border-bottom:1px solid #2a3945;background:#101c27;color:#e2e6e8;padding:0 18px;outline:none;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.results{max-height:360px;overflow:auto;padding:8px}.result{padding:10px 12px;border:1px solid transparent;cursor:pointer}.result:hover{border-color:#314554;background:#12202b}.result b{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8dee2}.result span{display:block;font-size:12px;color:#7e8c96;margin-top:4px}@media(max-width:1100px){.layout{grid-template-columns:220px 1fr}.toc{display:none}.topbar{grid-template-columns:120px 1fr 80px}.nav{gap:17px}}@media(max-width:780px){body{border-width:1px}.shell{padding:8px 10px 20px}.banner{font-size:12px;padding:0 10px;text-align:center}.topbar{grid-template-columns:1fr auto;height:58px}.nav{display:none}.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;max-height:none}.article{padding:22px 20px 40px}.article-head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}h1{font-size:34px}h2{font-size:27px}}

<body>
<div class="banner">Layer v0.2.0 is an internal pipeline build. Public deployment remains blocked on the consent architecture.</div>
<div class="shell"><header class="topbar"><div class="mark">LAYER</div><nav class="nav"><a class="active" href="#overview">Documentation</a><a href="#architecture">Architecture</a><a href="#contracts">Contracts</a><a href="#acceptance">Acceptance</a></nav><div class="star">✦</div></header><main class="layout"><aside class="panel sidebar"><div class="panel-title">Documentation</div><div class="side-inner" id="sidebar"></div></aside><section class="center"><button class="search" id="openSearch"><span>⌕</span><span>Search documentation…</span><span class="key">Ctrl K</span></button><article class="article" id="article"></article></section><aside class="panel toc"><div class="panel-title">On this page</div><div class="toc-inner" id="toc"></div></aside></main></div>
<div class="modal" id="modal"><div class="searchbox"><input id="q" placeholder="Search Layer documentation"/><div class="results" id="results"></div></div></div>
<script>
const pages={
overview:{g:'GET STARTED',t:'Layer',m:'LATEST · v0.2.0',s:'The kiosk pipeline, reduced to its operating contract.',b:`<p class="lead">Layer v0.2.0 proves one path end to end: capture one shopper, derive a constrained attribute set, rank garments from a local catalogue, generate a virtual try-on through a licensed provider, present the result, then erase session imagery and state.</p><div class="callout warn"><strong>Deployment condition</strong>This version is for internal pipeline validation. It must not be deployed to the public until the consent architecture exists.</div><h2 id="start">Start with the system boundary</h2><div class="cards"><div class="card"><b>Local by default</b><p>Capture support, profiling, recommendation, and catalogue browsing remain usable without the render network path.</p></div><div class="card"><b>Network for rendering</b><p>Bridge owns provider credentials and the only generative network request in the shopper session.</p></div><div class="card"><b>Five successful renders</b><p>The allowance increments on render success, not on tap, request, timeout, or provider failure.</p></div><div class="card"><b>Unattended operation</b><p>No normal session step may depend on a person standing beside the kiosk.</p></div></div><h2 id="scope">Scope</h2><p>Ship top-wear recommendations, capture and review, five virtual try-ons, a file-ingested local catalogue, camera-derived attributes, and append-only session events.</p><p>Do not ship consent or age gating, store handoff, QR takeaway, live inventory, size recommendation, bottom-wear, outfit combinations, health telemetry, or session-data model training in v0.2.0.</p>`},
boundaries:{g:'GET STARTED',t:'Build boundaries',m:'v0.2.0',s:'What may exist in the shipping build, and what must not.',b:`<h2 id="in">In scope</h2><ul><li>Top-wear: tees, shirts, and outerwear.</li><li>Variable-count garment recommendations.</li><li>Five successful renders per session.</li><li>Capture, review, render, reveal, and session wipe.</li><li>Catalogue ingestion from CSV.</li><li>Session events through Bridge.</li></ul><h2 id="out">Out of scope</h2><ul><li>Consent and age gating.</li><li>Store handoff, QR takeaway, reference codes, and alerts.</li><li>Brand slots and per-brand product structure.</li><li>Live inventory and per-size stock.</li><li>Size recommendation.</li><li>Bottom-wear, full-body, and outfit combinations.</li><li>Training on shopper session data.</li></ul><div class="callout"><strong>Rule</strong>Out-of-scope capability must not remain in the shipping build as dead code, a hidden demo path, or a feature flag.</div>`},
flow:{g:'GET STARTED',t:'Shopper flow',m:'S0 → S7',s:'A strict state machine with named return edges only.',b:`<div class="code">S0 ATTRACT
  ↓ touch
S1 POSITION
  ↓ exactly one person framed
S2 CAPTURE
  ↓ frame captured
S3 REVIEW ── retake ──→ S1
  ↓ confirmed
S4 PICKS
  ↓ garment tapped
S5 GENERATING
  ↓ render returned
S6 REVEAL ── try another ──→ S4
  ↓ done
S7 SESSION END
  ↓ wipe + timeout/start over
S0 ATTRACT</div><h2 id="privacy">Review is a privacy control</h2><p>At S3, <em>Retake</em> and <em>Looks good</em> must have equal visual weight. The shopper must be able to reject a frame that includes another person without the interface nudging them toward confirmation.</p><h2 id="timeout">Timeout</h2><p>After 10 seconds of inactivity, warn and reset to S0 with a full wipe. Do not fire the inactivity timeout while a render is in flight. S7 uses its own 20-second hold.</p>`},
architecture:{g:'GET STARTED',t:'How Layer works',m:'system architecture',s:'Four bounded subsystems and one external rendering dependency.',b:`<div class="code">shopper
   │
   ▼
Frontend ── capture + framing ── MediaPipe
   │
   ├── derived attributes ─────────────┐
   ▼                                  │
Layer Expert System ◀── local catalogue
   │ ranked garment IDs
   ▼
Frontend ── selected garment + image ──→ Bridge
                                         │
                                         ▼
                              licensed VTON provider
                                         │
                                         ▼
                                   inline render</div><h2 id="frontend">Frontend</h2><p>Own the state machine, camera lifecycle, capture review, shopper interaction, render allowance, inactivity handling, and in-memory session wipe.</p><h2 id="les">Layer Expert System</h2><p>Run locally. Derive the permitted visual attributes and rank the local catalogue with deterministic rules whose weights live in configuration.</p><h2 id="bridge">Bridge</h2><p>Validate and synchronize catalogue data, proxy rendering behind an internal provider interface, store append-only session events, and keep provider secrets away from the frontend.</p><h2 id="hardware">Hardware</h2><p>Fix the camera geometry, portrait display, frontal lighting, grey reference patch, compute envelope, power behavior, and SIM connectivity assumptions that software relies on.</p>`},
frontend:{g:'GUIDES',t:'Frontend',m:'owner · shopper runtime',s:'The user-facing state machine and session memory boundary.',b:`<h2 id="responsibilities">Responsibilities</h2><ul><li>Implement S0 through S7 exactly.</li><li>Open the camera only from S1 onward.</li><li>Keep the camera disclosure in one fixed position from S1 through S7.</li><li>Count only successful renders toward the five-render allowance.</li><li>Return failed renders to a designed recovery state.</li><li>Keep captured images in RAM only.</li><li>Wipe captured images, derived attributes, and session state at S7 and on timeout.</li></ul><h2 id="display">Display target</h2><p>Design for 1080 × 1920 portrait touch. High contrast is required. Dark grounds and saturated color are allowed, but every state must be verified on the physical panel at its intended viewing distance before lock.</p>`},
les:{g:'GUIDES',t:'Layer Expert System',m:'local · deterministic',s:'A rules-based recommender, not a trained model.',b:`<p class="lead">LES ranks garments from the local catalogue using a small set of explicitly permitted session attributes. It must remain deterministic, explainable, and configurable.</p><h2 id="inputs">Inputs</h2><ul><li>Category selected by the shopper.</li><li>Pose ratios: shoulder-to-hip and torso-to-leg.</li><li>Grey-patch-normalized skin-tone bucket.</li><li>Current outfit color from pose-bounded image regions.</li><li>Standing distance.</li></ul><h2 id="never">Do not infer</h2><ul><li>Gender.</li><li>Body measurements.</li><li>Size.</li><li>Age.</li></ul><h2 id="performance">Runtime</h2><p>Recommendation runs locally and must respond within 500 ms at p95. Identical inputs must produce identical outputs. Rule weights live in configuration and must take effect without rebuilding the application.</p>`},
bridge:{g:'GUIDES',t:'Bridge',m:'integration boundary',s:'Catalogue validation, provider abstraction, and event storage.',b:`<h2 id="catalogue">Catalogue</h2><p>Accept a complete CSV replacement, validate it before commit, show an accurate preview, then write the accepted catalogue to the synced local folder watched by the kiosk. Never partially accept a malformed file.</p><h2 id="render">Render proxy</h2><p>Hold provider credentials, call the licensed provider through an internal provider interface, enforce the hard timeout, and return image bytes inline. Do not use provider storage for shopper render output.</p><h2 id="events">Session events</h2><p>Store batched append-only events. <code>suggestions_shown</code> must record every garment ID exposed to the shopper, not only garments they tap.</p><h2 id="tagging">Garment tagging</h2><p>Fit, color family, pattern, and formality are manually curated in v0.2.0. Bridge supplies the interface; it does not infer these fields.</p>`},
hardware:{g:'GUIDES',t:'Hardware',m:'physical boundary',s:'The geometry and environment that software is allowed to assume.',b:`<div class="table-wrap"><table><thead><tr><th>Constraint</th><th>v0.2.0</th></tr></thead><tbody><tr><td>Display</td><td>ACER UT242Y · 23.8 in · portrait · 1080 × 1920</td></tr><tr><td>Input</td><td>Touch only</td></tr><tr><td>Camera</td><td>Logitech Brio 4K · portrait · 78° dFoV · fixed at 0.85 m</td></tr><tr><td>Capture</td><td>1080 × 1920 portrait</td></tr><tr><td>Marker</td><td>1.5 m from camera</td></tr><tr><td>Compute</td><td>i5-14400 · UHD 730 · 16 GB single-channel · 1 TB NVMe</td></tr><tr><td>Lighting</td><td>Controlled frontal light with fixed neutral-grey reference patch</td></tr><tr><td>Network</td><td>SIM router; intermittent service assumed</td></tr></tbody></table></div><h2 id="boot">Boot behavior</h2><p>After cold power loss, boot directly to S0. Do not expose a login, desktop, or operating-system dialog.</p>`},
states:{g:'REFERENCE',t:'States and errors',m:'designed failures',s:'Every expected fault lands in a defined state with a defined exit.',b:`<div class="table-wrap"><table><thead><tr><th>ID</th><th>Trigger</th><th>Behavior</th></tr></thead><tbody><tr><td>E1</td><td>No pose for 10 s</td><td>Ask the shopper to stand on the marker.</td></tr><tr><td>E2</td><td>Multiple people</td><td>Ask for one person. Never auto-select.</td></tr><tr><td>E3</td><td>Render error or timeout</td><td>Acknowledge and return to picks. Two consecutive failures disable rendering for the session.</td></tr><tr><td>E4</td><td>Offline</td><td>Browse-only banner. Local catalogue remains usable.</td></tr><tr><td>E5</td><td>Camera missing</td><td>Full-screen fault; block shopper flow.</td></tr><tr><td>E6</td><td>Five renders spent</td><td>Explain that all five looks are used; offer start over.</td></tr><tr><td>E7</td><td>Garment ineligible</td><td>Omit the card silently.</td></tr><tr><td>E8</td><td>Daily spend ceiling</td><td>Use the same browse-only banner as E4.</td></tr></tbody></table></div>`},
contracts:{g:'REFERENCE',t:'Integration contracts',m:'supported seams',s:'Subsystems communicate through these contracts and do not reach around them.',b:`<h2 id="recommend">Recommendation</h2><div class="code">POST /layer/recommend
{ session_id, category, count, attributes }
→ 200 { suggestions: [ { garment_id, rank_reason_code } ] }</div><p>Target p95 latency: 500 ms. <code>attributes: null</code> must return a valid non-personalized result.</p><h2 id="render-contract">Render</h2><div class="code">POST /bridge/render
{ session_id, garment_id, person_image: base64 }
→ 200 { image: base64, latency_ms, credits_consumed }
→ 4xx/5xx → E3</div><p>Hard timeout: 20 s. Failed renders do not consume the five-render allowance.</p><h2 id="events-contract">Events</h2><div class="code">POST /bridge/events
{ event_id, kiosk_id, session_id, event_type, timestamp, payload }</div><p>Never write shopper images to this stream.</p>`},
guardrails:{g:'REFERENCE',t:'Guardrails',m:'non-negotiable',s:'Privacy, licensing, and boundary constraints.',b:`<ul><li>Keep captured images in RAM only.</li><li>Show camera disclosure continuously from S1 through S7.</li><li>Keep all provider credentials out of the frontend.</li><li>Do not ship non-commercially licensed components, fixtures, seed data, or demo paths.</li><li>Verify every model, dataset, and dependency against its actual LICENSE file.</li><li>Return render output inline; do not create a provider-storage copy.</li><li>Do not use provider output to create or improve an in-house try-on model.</li><li>Do not enable provider Data Labeling or attach shopper imagery to support tickets.</li><li>Treat narrow horizontal framing as a privacy control.</li></ul>`},
acceptance:{g:'REFERENCE',t:'Acceptance',m:'observable pass/fail',s:'Completion is measured, not asserted.',b:`<h2 id="front">Frontend</h2><ul><li>Complete S0 → S7 without operator intervention in 20 of 20 consecutive attempts.</li><li>Reach each shopper-visible error state on demand and provide a route out.</li><li>Verify rotated touch coordinates at all four corners and center.</li><li>Verify the camera remains closed before S1.</li><li>Verify the render counter changes only on successful renders.</li><li>Verify the session wipe removes image signatures from process memory.</li><li>Verify every state on the physical panel at its intended viewing distance.</li></ul><h2 id="engine">Layer Expert System</h2><ul><li>Respond within 500 ms at p95 over 100 calls.</li><li>Return a valid result when attributes are null.</li><li>Never return <code>render_eligible = false</code>.</li><li>Produce identical output for identical input.</li></ul><h2 id="bridge-a">Bridge</h2><ul><li>Complete renders within 15 s at 95% success or better over the kiosk SIM connection.</li><li>Prove that no provider credential exists in the frontend bundle.</li><li>Reject malformed catalogue files without modifying the live catalogue.</li><li>Prove provider output is not written to provider storage.</li></ul>`}
};
const order=[['GET STARTED',['overview','boundaries','flow','architecture']],['GUIDES',['frontend','les','bridge','hardware']],['REFERENCE',['states','contracts','guardrails','acceptance']]];const names={overview:'Overview',boundaries:'Build boundaries',flow:'Shopper flow',architecture:'How Layer works',frontend:'Frontend',les:'Layer Expert System',bridge:'Bridge',hardware:'Hardware',states:'States & errors',contracts:'Integration contracts',guardrails:'Guardrails',acceptance:'Acceptance'};const sidebar=document.getElementById('sidebar'),article=document.getElementById('article'),toc=document.getElementById('toc');function side(id){sidebar.innerHTML=order.map(([g,ids])=>`<div class="group"><div class="group-label">${g}</div>${ids.map(x=>`<a class="side-link ${x===id?'active':''}" href="#${x}">${names[x]}</a>`).join('')}</div>`).join('')}function page(id){const p=pages[id]||pages.overview;article.innerHTML=`<div class="article-head"><div><div class="kicker">${p.g}</div><h1>${p.t}</h1></div><div class="meta">${p.m.replace('LATEST','<b>LATEST</b>')}</div></div><p class="lead" style="margin-top:20px">${p.s}</p>${p.b}<div class="footer">Source of truth: Mirai Layer Kiosk — Product Requirements Document, v0.2.0. This is a high-level reading surface; the PRD remains authoritative.</div>`;side(id);toc.innerHTML=[...article.querySelectorAll('h2,h3')].map((h,i)=>{if(!h.id)h.id='s'+i;return `<a href="#${h.id}">${h.textContent}</a>`}).join('')||'<a href="#">Overview</a>';document.title=`${p.t} — Layer Documentation`;window.scrollTo(0,0)}function route(){const id=location.hash.slice(1);page(pages[id]?id:'overview')}window.addEventListener('hashchange',route);route();const modal=document.getElementById('modal'),q=document.getElementById('q'),results=document.getElementById('results');function show(v=''){v=v.toLowerCase().trim();const ids=Object.keys(pages).filter(id=>!v||(names[id]+' '+pages[id].s+' '+pages[id].b.replace(/<[^>]+>/g,' ')).toLowerCase().includes(v));results.innerHTML=ids.slice(0,10).map(id=>`<div class="result" data-id="${id}"><b>${names[id]}</b><span>${pages[id].s}</span></div>`).join('')||'<div class="result"><span>No matching page.</span></div>';results.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{location.hash=el.dataset.id;modal.classList.remove('open')})}function open(){modal.classList.add('open');q.value='';show();setTimeout(()=>q.focus(),20)}document.getElementById('openSearch').onclick=open;q.oninput=()=>show(q.value);modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open()}if(e.key==='Escape')modal.classList.remove('open')});
</script>
